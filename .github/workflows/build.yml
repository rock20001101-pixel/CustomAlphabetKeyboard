name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q CustomAlphabetKeyboard-1.zip.bak -d project
          echo "Searching for Gradle project..."
          find project -name settings.gradle -o -name build.gradle

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -print -quit)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomAlphabetKeyboard-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk

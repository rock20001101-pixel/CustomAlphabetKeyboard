name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find project
        run: |
          echo "Files in repository:"
          find . -maxdepth 4 -type f | head -100

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q CustomAlphabetKeyboard-1.zip.bak -d project
          echo "Extracted:"
          find project -maxdepth 4 -type f

      - name: Build APK
        run: |
          cd project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomAlphabetKeyboard-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk

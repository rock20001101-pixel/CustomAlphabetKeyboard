name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          mkdir project
          unzip -q CustomAlphabetKeyboard-1.zip.bak -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f

      - name: Build APK
        working-directory: project/CustomAlphabetKeyboard
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomAlphabetKeyboard-APK
          path: project/CustomAlphabetKeyboard/app/build/outputs/apk/debug/app-debug.apk
